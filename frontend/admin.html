<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reading Room — Librarian</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page">
  <div class="topbar">
    <div class="brand">Reading <span>Room</span></div>
    <div class="session-info">
      <span id="welcomeText"></span>
      <span class="role-tag" id="roleTag"></span>
      <button class="btn btn-outline btn-small" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <h2 class="section-title">Add to catalogue</h2>
  <form class="inline-form" id="addResourceForm">
    <div class="field">
      <label for="resTitle">Title</label>
      <input type="text" id="resTitle" required />
    </div>
    <div class="field">
      <label for="resAuthor">Author</label>
      <input type="text" id="resAuthor" />
    </div>
    <div class="field">
      <label for="resType">Type</label>
      <select id="resType">
        <option value="BOOK">Book</option>
        <option value="DVD">DVD</option>
      </select>
    </div>
    <div class="field" style="max-width:100px;">
      <label for="resCopies">Copies</label>
      <input type="number" id="resCopies" min="1" value="1" required />
    </div>
    <button class="btn" type="submit">Add</button>
  </form>
  <div class="form-msg" id="addResMsg"></div>

  <h2 class="section-title">Catalogue</h2>
  <div class="catalogue" id="catalogueList">
    <div class="empty">Loading…</div>
  </div>

  <h2 class="section-title">Users</h2>
  <div class="catalogue" id="usersList">
    <div class="empty">Loading…</div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
