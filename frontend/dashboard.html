<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reading Room — Catalogue</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page">
  <div class="topbar">
    <div class="brand">Reading <span>Room</span></div>
    <div class="session-info">
      <span id="welcomeText"></span>
      <span class="role-tag" id="roleTag"></span>
      <button class="btn btn-outline btn-small" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <h2 class="section-title">My borrowed items</h2>
  <div class="catalogue" id="myBorrowsList">
    <div class="empty">Loading…</div>
  </div>

  <h2 class="section-title">Catalogue</h2>
  <div class="catalogue" id="catalogueList">
    <div class="empty">Loading…</div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
